<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PingAgent history</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
    --series: #2a78d6; --series-wash: rgba(42,120,214,0.12);
    --warn: #fab219; --bad: #d03b3b; --good: #0ca30c;
    --hover: rgba(11,11,11,0.05);
    --smoke: 11,11,11; --outage: rgba(208,59,59,0.16);
    --loss0: #1f9e00; --loss1: #0086c7; --loss2: #0059ff; --loss3: #5e00ff; --loss4: #7e00ff; --loss5: #b800d6; --loss6: #e00000;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
      --series: #3987e5; --series-wash: rgba(57,135,229,0.16);
      --hover: rgba(255,255,255,0.06);
      --smoke: 255,255,255; --outage: rgba(230,103,103,0.22);
      --loss0: #3dff1a; --loss1: #1ec0ff; --loss2: #4d8bff; --loss3: #8f5cff; --loss4: #a366ff; --loss5: #e04dff; --loss6: #ff4d4d;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --series: #3987e5; --series-wash: rgba(57,135,229,0.16);
    --hover: rgba(255,255,255,0.06);
    --smoke: 255,255,255; --outage: rgba(230,103,103,0.22);
    --loss0: #3dff1a; --loss1: #1ec0ff; --loss2: #4d8bff; --loss3: #8f5cff; --loss4: #a366ff; --loss5: #e04dff; --loss6: #ff4d4d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 40px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 16px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  .sub { color: var(--ink-2); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 16px; }
  .filters .label { color: var(--ink-2); margin-right: 4px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .seg button {
    appearance: none; border: 0; background: transparent; color: var(--ink-2);
    font: inherit; padding: 6px 12px; cursor: pointer; min-width: 44px;
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button:hover { background: var(--hover); }
  .seg button[aria-pressed="true"] { color: var(--ink); font-weight: 600; background: var(--hover); }
  .seg button:focus-visible { outline: 2px solid var(--series); outline-offset: -2px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .tile .l { color: var(--ink-2); font-size: 13px; }
  .tile .v { font-size: 26px; font-weight: 600; line-height: 1.2; margin-top: 2px; }
  .tile .v small { font-size: 14px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 16px 8px; position: relative; }
  .card h2 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  .card .sub { font-size: 13px; margin-bottom: 8px; }
  .chart-wrap { position: relative; }
  canvas { display: block; width: 100%; height: 360px; touch-action: none; }
  .tip {
    position: absolute; pointer-events: none; display: none;
    background: var(--surface); color: var(--ink); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    min-width: 170px; z-index: 2;
  }
  .tip .t { color: var(--ink-2); margin-bottom: 4px; }
  .tip .row { display: flex; justify-content: space-between; gap: 16px; }
  .tip .row b { font-weight: 600; }
  .tip .key { display: inline-block; width: 12px; height: 2px; background: var(--series); vertical-align: middle; margin-right: 6px; border-radius: 1px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--ink-2); font-size: 13px; margin: 8px 0 4px; }
  .legend { align-items: center; }
  .legend .group { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
  .legend .k::before { content: ""; display: inline-block; vertical-align: middle; margin-right: 6px; }
  .legend .line::before { width: 14px; height: 3px; border-radius: 1px; background: var(--c); }
  .legend .smoke::before { width: 14px; height: 12px; border-radius: 2px;
    background: linear-gradient(to bottom, rgba(var(--smoke),0.08), rgba(var(--smoke),0.45) 50%, rgba(var(--smoke),0.08)); }
  .legend .outage::before { width: 12px; height: 12px; border-radius: 2px; background: var(--outage); box-shadow: inset 0 0 0 1px var(--border); }
  .legend .ref::before { width: 14px; height: 1px; background: var(--muted); }
  details { margin-top: 16px; }
  summary { cursor: pointer; color: var(--ink-2); }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; font-variant-numeric: tabular-nums; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th, td { text-align: right; padding: 6px 10px; border-top: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; }
  thead th { border-top: 0; color: var(--ink-2); font-weight: 600; }
  .empty { padding: 48px 16px; text-align: center; color: var(--ink-2); }
  footer { color: var(--muted); font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>PingAgent history</h1>
    <div class="sub" id="subtitle"></div>
  </header>

  <div class="filters" role="group" aria-label="Time range">
    <span class="label">Show last</span>
    <div class="seg" id="ranges"></div>
  </div>

  <div class="tiles" id="tiles"></div>

  <section class="card">
    <h2 id="chart-title">Round-trip time</h2>
    <div class="sub" id="chart-sub"></div>
    <div class="chart-wrap">
      <canvas id="chart" aria-label="Round-trip time over the selected range" role="img" tabindex="0"></canvas>
      <div class="tip" id="tip"></div>
    </div>
    <div class="legend" id="legend">
      <span class="k smoke">smoke: every ping in the step, darker where they cluster</span>
      <span class="group" id="loss-key"><span>median, coloured by packet loss:</span></span>
      <span class="k outage">no replies at all</span>
      <span class="k ref">amber and red thresholds</span>
    </div>
  </section>

  <details>
    <summary>Hourly table for this range</summary>
    <table id="table">
      <thead><tr><th>Hour</th><th>Pings</th><th>Avg ms</th><th>Min ms</th><th>Max ms</th><th>Lost</th><th>Loss %</th></tr></thead>
      <tbody></tbody>
    </table>
  </details>

  <footer id="footer"></footer>
</main>

<script>
// Injected by PingAgent. DATA rows are [epochSeconds, rttMs]; rttMs is -1 for a
// timeout and -2 for an error (could not send).
const META = __META__;
const DATA = __DATA__;
</script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const fmtMs = (v) => v == null ? "–" : (v < 1 ? "<1" : Math.round(v).toLocaleString());
  const pad = (n) => String(n).padStart(2, "0");
  const fmtTime = (sec, withDate) => {
    const d = new Date(sec * 1000);
    const hm = pad(d.getHours()) + ":" + pad(d.getMinutes());
    return withDate ? `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${hm}` : hm;
  };
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  const RANGES = [
    { key: "1h", label: "1 h", secs: 3600 },
    { key: "6h", label: "6 h", secs: 6 * 3600 },
    { key: "24h", label: "24 h", secs: 24 * 3600 },
    { key: "7d", label: "7 d", secs: 7 * 86400 },
    { key: "all", label: "All", secs: null },
  ];
  const latest = DATA.length ? DATA[DATA.length - 1][0] : Math.floor(Date.now() / 1000);
  const earliest = DATA.length ? DATA[0][0] : latest - 3600;
  let rangeKey = (() => {
    const fromHash = location.hash.replace("#", "");
    if (fromHash) return fromHash;
    try { return localStorage.getItem("pingagent.range") || "24h"; } catch { return "24h"; }
  })();
  const stored = RANGES.find(r => r.key === rangeKey) ? rangeKey : "24h";
  rangeKey = stored;

  $("#subtitle").textContent = `${META.host} · amber from ${META.warn_ms} ms, red from ${META.bad_ms} ms · keeping ${META.history_days} day${META.history_days === 1 ? "" : "s"}`;
  $("#footer").textContent = `Generated ${META.generated} by PingAgent ${META.version}. Data: ${META.history_dir}`;

  // ---- filters -------------------------------------------------------------
  const seg = $("#ranges");
  for (const r of RANGES) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = r.label; b.dataset.key = r.key;
    b.setAttribute("aria-pressed", String(r.key === rangeKey));
    b.addEventListener("click", () => { rangeKey = r.key; try { localStorage.setItem("pingagent.range", r.key); } catch {} render(); });
    seg.appendChild(b);
  }

  function slice() {
    const r = RANGES.find(x => x.key === rangeKey);
    const from = r.secs == null ? earliest : latest - r.secs;
    let lo = 0, hi = DATA.length;
    while (lo < hi) { const m = (lo + hi) >> 1; if (DATA[m][0] < from) lo = m + 1; else hi = m; }
    return { rows: DATA.slice(lo), from, to: latest };
  }

  // ---- stats -------------------------------------------------------------
  function stats(rows) {
    const vals = [];
    let lost = 0;
    for (const [, v] of rows) { if (v >= 0) vals.push(v); else lost++; }
    vals.sort((a, b) => a - b);
    const q = (p) => vals.length ? vals[Math.min(vals.length - 1, Math.floor(p * vals.length))] : null;
    const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
    const sd = vals.length > 1 ? Math.sqrt(vals.reduce((a, b) => a + (b - avg) * (b - avg), 0) / (vals.length - 1)) : null;
    return { n: rows.length, replies: vals.length, lost, avg, sd, p50: q(0.5), p95: q(0.95), max: vals.length ? vals[vals.length - 1] : null,
             loss: rows.length ? lost / rows.length * 100 : 0 };
  }

  function tile(label, value, unit) {
    const d = document.createElement("div"); d.className = "tile";
    const l = document.createElement("div"); l.className = "l"; l.textContent = label;
    const v = document.createElement("div"); v.className = "v"; v.textContent = value;
    if (unit) { const s = document.createElement("small"); s.textContent = unit; v.appendChild(s); }
    d.append(l, v); return d;
  }

  // ---- chart -------------------------------------------------------------
  const canvas = $("#chart"), tip = $("#tip");
  const ctx = canvas.getContext("2d");
  let view = null; // last layout, for hover

  function niceCeil(v) {
    if (v <= 0) return 10;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    for (const m of [1, 2, 2.5, 5, 10]) { if (m * p >= v) return m * p; }
    return 10 * p;
  }
  function niceStep(range, maxTicks) {
    const raw = range / maxTicks;
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    for (const m of [1, 2, 2.5, 5, 10]) { if (m * p >= raw) return m * p; }
    return 10 * p;
  }
  function timeTicks(from, to, width) {
    const span = to - from;
    const steps = [60, 300, 600, 900, 1800, 3600, 7200, 3*3600, 6*3600, 12*3600, 86400, 2*86400, 7*86400];
    const want = Math.max(3, Math.floor(width / 110));
    let step = steps.find(s => span / s <= want) || steps[steps.length - 1];
    const ticks = [];
    const tz = new Date(from * 1000).getTimezoneOffset() * 60;
    let t = Math.ceil((from - tz) / step) * step + tz;
    for (; t <= to; t += step) ticks.push(t);
    return { ticks, withDate: span > 86400, daily: step >= 86400 };
  }

  // SmokePing-style rendering. The range is cut into steps sized to hold about
  // 20 pings each. Per step: the "smoke" is every reply drawn as nested
  // translucent bands (sorted values paired from the outside in), so it gets
  // darker where pings cluster; the median is a short bar coloured by the
  // step's packet loss; a step with no replies at all is tinted.
  const STEP_SIZES = [5, 10, 15, 30, 60, 120, 300, 600, 900, 1200, 1800, 3600, 7200, 10800, 21600, 43200, 86400];
  const PINGS_PER_STEP = 20;
  const MIN_STEPS = 100;
  const SMOKE_MAX = 0.55; // opacity where every band overlaps
  const LOSS_BINS = [
    { test: (p) => p <= 0, label: "none" },
    { test: (p) => p <= 5, label: "up to 5%" },
    { test: (p) => p <= 10, label: "up to 10%" },
    { test: (p) => p <= 15, label: "up to 15%" },
    { test: (p) => p < 50, label: "15 to 50%" },
    { test: (p) => p < 95, label: "50 to 95%" },
    { test: () => true, label: "95% or more" },
  ];
  const lossBin = (p) => LOSS_BINS.findIndex(b => b.test(p));
  const lossColor = (p) => css(`--loss${lossBin(p)}`);

  (function buildLossKey() {
    const key = $("#loss-key");
    LOSS_BINS.forEach((b, i) => {
      const s = document.createElement("span");
      s.className = "k line"; s.style.setProperty("--c", `var(--loss${i})`); s.textContent = b.label;
      key.appendChild(s);
    });
  })();

  function quantile(sorted, p) {
    if (!sorted.length) return null;
    const i = (sorted.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i);
    return sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo);
  }
  // The ping interval in effect for most of the time span (gaps weighted by their
  // length), so a schedule with fast daytime pings doesn't make night steps sparse.
  function typicalInterval(rows) {
    const d = [];
    let total = 0;
    for (let i = 1; i < rows.length; i++) { const g = rows[i][0] - rows[i - 1][0]; if (g > 0 && g < 3600) { d.push(g); total += g; } }
    if (!d.length) return 5;
    d.sort((a, b) => a - b);
    let acc = 0;
    for (const g of d) { acc += g; if (acc >= total / 2) return g; }
    return d[d.length - 1];
  }
  const fmtDay = (sec) => new Date(sec * 1000).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  const fmtStep = (s) => s < 60 ? `${s} s` : s < 3600 ? `${s / 60} min` : `${s / 3600} h`;

  function layout(rows, from, to) {
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.clientWidth, H = canvas.clientHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const pad = { l: 52, r: 16, t: 22, b: 44 };
    const plotW = Math.max(10, W - pad.l - pad.r), plotH = Math.max(10, H - pad.t - pad.b);
    const span = Math.max(1, to - from);

    // About PINGS_PER_STEP pings per step, but never fewer than ~MIN_STEPS steps
    // across the range, and never narrower than a pixel.
    const perPx = span / plotW;
    const target = Math.min(Math.max(perPx, PINGS_PER_STEP * typicalInterval(rows)), Math.max(perPx, span / MIN_STEPS));
    const minStep = STEP_SIZES.find(s => s >= perPx) || STEP_SIZES[STEP_SIZES.length - 1];
    const step = Math.max(minStep, STEP_SIZES.filter(s => s <= target).pop() || STEP_SIZES[0]);
    const tz = new Date(from * 1000).getTimezoneOffset() * 60; // align steps to local clock
    const byKey = new Map();
    for (const [t, v] of rows) {
      const k = Math.floor((t - tz) / step);
      let b = byKey.get(k);
      if (!b) byKey.set(k, b = { k, t0: k * step + tz, t1: (k + 1) * step + tz, vals: [], lost: 0 });
      if (v >= 0) b.vals.push(v); else b.lost++;
    }
    const steps = [...byKey.values()].sort((a, b) => a.k - b.k);
    const xOf = (t) => pad.l + Math.min(plotW, Math.max(0, (t - from) / span * plotW));
    const tops = [];
    for (const b of steps) {
      b.vals.sort((a, c) => a - c);
      b.n = b.vals.length + b.lost;
      b.loss = b.lost / b.n * 100;
      b.median = quantile(b.vals, 0.5);
      // Like SmokePing's fixed 20 pings per step: a step with more pings is reduced
      // to 20 mid-point percentiles (what 20 sampled pings would show on average),
      // so the smoke means the same at every zoom level and rare spikes stay rare.
      b.smoke = b.vals.length <= PINGS_PER_STEP
        ? b.vals
        : Array.from({ length: PINGS_PER_STEP }, (_, i) => quantile(b.vals, (i + 0.5) / PINGS_PER_STEP));
      b.x0 = xOf(b.t0); b.x1 = xOf(b.t1);
      if (b.vals.length) tops.push(quantile(b.vals, 0.9));
    }
    tops.sort((a, b) => a - b);
    // Scale to the typical top of the smoke, not to rare spikes (those clip at the top).
    const yMax = niceCeil(Math.max((quantile(tops, 0.98) || 0) * 1.15, 10));
    return { W, H, pad, plotW, plotH, steps, step, yMax, from, to, span };
  }

  function draw(v, hi) {
    const { W, H, pad, plotW, plotH, steps, yMax, from, to } = v;
    const col = { grid: css("--grid"), axis: css("--axis"), muted: css("--muted"), ink2: css("--ink-2"),
                  surface: css("--surface"), smoke: css("--smoke"), outage: css("--outage"), hover: css("--hover") };
    ctx.clearRect(0, 0, W, H);
    ctx.font = "12px system-ui, -apple-system, 'Segoe UI', sans-serif";
    const y = (ms) => pad.t + plotH - Math.min(ms, yMax) / yMax * plotH;

    // Grid + y ticks.
    const tick = niceStep(yMax, 5);
    ctx.lineWidth = 1; ctx.strokeStyle = col.grid; ctx.fillStyle = col.muted; ctx.textAlign = "right"; ctx.textBaseline = "middle";
    for (let t = 0; t <= yMax + 1e-9; t += tick) {
      const yy = Math.round(y(t)) + 0.5;
      ctx.beginPath(); ctx.moveTo(pad.l, yy); ctx.lineTo(pad.l + plotW, yy); ctx.stroke();
      ctx.fillText(t.toLocaleString(), pad.l - 8, yy);
    }
    ctx.textAlign = "right"; ctx.textBaseline = "bottom";
    ctx.fillText("ms", pad.l - 8, pad.t - 8);

    ctx.save();
    ctx.beginPath(); ctx.rect(pad.l, pad.t, plotW, plotH); ctx.clip();

    if (hi != null && steps[hi]) {
      const b = steps[hi];
      ctx.fillStyle = col.hover; ctx.fillRect(b.x0, pad.t, Math.max(1, b.x1 - b.x0), plotH);
    }
    // Fixed opacity per layer, as if every step had PINGS_PER_STEP pings: thin
    // steps and lone spikes stay faint, a full step reaches SMOKE_MAX at its core.
    const layerAlpha = 1 - Math.pow(1 - SMOKE_MAX, 2 / PINGS_PER_STEP);
    const smokeFill = `rgba(${col.smoke},${layerAlpha.toFixed(4)})`;
    for (const b of steps) {
      const w = Math.max(1, b.x1 - b.x0);
      ctx.fillStyle = smokeFill;
      if (!b.vals.length) { // complete outage for this step
        ctx.fillStyle = col.outage; ctx.fillRect(b.x0, pad.t, w, plotH);
        continue;
      }
      const q = b.smoke, layers = Math.floor(q.length / 2);
      for (let i = 0; i < layers; i++) {
        const yTop = y(q[q.length - 1 - i]), yBot = y(q[i]);
        ctx.fillRect(b.x0, yTop, w, Math.max(1, yBot - yTop));
      }
    }
    for (const b of steps) { // medians on top of all smoke
      if (b.median == null) continue;
      ctx.fillStyle = lossColor(b.loss);
      ctx.fillRect(b.x0, Math.round(y(b.median)) - 1, Math.max(1.5, b.x1 - b.x0), 2.5);
    }
    ctx.restore();

    // Threshold reference lines: neutral hairlines so they never read as loss colours.
    for (const [ms, label] of [[META.warn_ms, "amber"], [META.bad_ms, "red"]]) {
      if (ms > yMax) continue;
      const yy = Math.round(y(ms)) + 0.5;
      ctx.strokeStyle = col.muted; ctx.beginPath(); ctx.moveTo(pad.l, yy); ctx.lineTo(pad.l + plotW, yy); ctx.stroke();
      const text = `${label} ${ms} ms`;
      const tw = ctx.measureText(text).width;
      ctx.fillStyle = col.surface; ctx.fillRect(pad.l + plotW - 8 - tw, yy - 17, tw + 8, 15);
      ctx.fillStyle = col.ink2; ctx.textAlign = "right"; ctx.textBaseline = "bottom";
      ctx.fillText(text, pad.l + plotW - 4, yy - 3);
    }

    // Baseline + x ticks.
    const base = pad.t + plotH + 0.5;
    ctx.strokeStyle = col.axis; ctx.beginPath(); ctx.moveTo(pad.l, base); ctx.lineTo(pad.l + plotW, base); ctx.stroke();
    const { ticks, withDate, daily } = timeTicks(from, to, plotW);
    ctx.fillStyle = col.muted; ctx.textAlign = "center"; ctx.textBaseline = "top";
    for (const t of ticks) {
      const x = pad.l + (t - from) / (to - from) * plotW;
      ctx.strokeStyle = col.grid; ctx.beginPath(); ctx.moveTo(Math.round(x) + 0.5, base); ctx.lineTo(Math.round(x) + 0.5, base + 4); ctx.stroke();
      ctx.fillText(daily ? fmtDay(t) : fmtTime(t, withDate), x, base + 8);
    }
  }

  // ---- hover ---------------------------------------------------------------
  let hoverIdx = null;
  function stepAt(x) {
    const { steps } = view;
    let best = -1, bestD = 13;
    for (let i = 0; i < steps.length; i++) {
      const b = steps[i];
      if (x >= b.x0 && x < Math.max(b.x1, b.x0 + 1)) return i;
      const d = Math.min(Math.abs(x - b.x0), Math.abs(x - b.x1));
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }
  function showStep(i) {
    if (!view || i < 0 || i >= view.steps.length) { hideHover(); return; }
    hoverIdx = i;
    draw(view, i);
    const b = view.steps[i];
    const span = view.to - view.from;
    tip.replaceChildren();
    const t = document.createElement("div"); t.className = "t";
    t.textContent = `${fmtTime(b.t0, span > 86400)} to ${fmtTime(b.t1, false)}`;
    tip.appendChild(t);
    const row = (label, value, color) => {
      const r = document.createElement("div"); r.className = "row";
      const l = document.createElement("span");
      if (color) { const k = document.createElement("i"); k.className = "key"; k.style.background = color; l.appendChild(k); }
      l.appendChild(document.createTextNode(label));
      const v = document.createElement("b"); v.textContent = value;
      r.append(v, l); tip.appendChild(r);
    };
    if (b.vals.length) {
      row("median", fmtMs(b.median) + " ms", lossColor(b.loss));
      if (b.vals.length > 1) {
        row("middle half", `${fmtMs(quantile(b.vals, 0.25))} to ${fmtMs(quantile(b.vals, 0.75))} ms`);
        row("min to max", `${fmtMs(b.vals[0])} to ${fmtMs(b.vals[b.vals.length - 1])} ms`);
      }
    }
    row("packet loss", `${b.lost} of ${b.n} (${b.loss.toFixed(b.loss && b.loss < 10 ? 1 : 0)}%)`);
    tip.style.display = "block";
    const cx = (b.x0 + b.x1) / 2, tw = tip.offsetWidth;
    tip.style.left = `${cx + 14 + tw > canvas.clientWidth ? cx - 14 - tw : cx + 14}px`;
    tip.style.top = `${view.pad.t + 8}px`;
  }
  function hideHover() { hoverIdx = null; tip.style.display = "none"; if (view) draw(view); }
  canvas.addEventListener("pointermove", (e) => {
    if (!view) return;
    const x = e.clientX - canvas.getBoundingClientRect().left;
    if (x < view.pad.l || x > view.pad.l + view.plotW) { hideHover(); return; }
    const i = stepAt(x);
    if (i < 0) hideHover(); else if (i !== hoverIdx) showStep(i);
  });
  canvas.addEventListener("pointerleave", hideHover);
  canvas.addEventListener("keydown", (e) => {
    if (!view || !view.steps.length) return;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      e.preventDefault();
      const dir = e.key === "ArrowLeft" ? -1 : 1;
      const i = hoverIdx == null ? (dir < 0 ? view.steps.length - 1 : 0) : Math.min(view.steps.length - 1, Math.max(0, hoverIdx + dir));
      showStep(i);
    } else if (e.key === "Escape") hideHover();
  });

  // ---- table ---------------------------------------------------------------
  function fillTable(rows) {
    const tb = $("#table tbody"); tb.replaceChildren();
    const byHour = new Map();
    for (const [t, v] of rows) {
      const h = t - (t % 3600);
      let b = byHour.get(h); if (!b) byHour.set(h, b = { n: 0, sum: 0, cnt: 0, min: Infinity, max: -Infinity, lost: 0 });
      b.n++; if (v >= 0) { b.sum += v; b.cnt++; b.min = Math.min(b.min, v); b.max = Math.max(b.max, v); } else b.lost++;
    }
    for (const [h, b] of [...byHour.entries()].sort((a, c) => c[0] - a[0])) {
      const tr = document.createElement("tr");
      const cells = [fmtTime(h, true), String(b.n), b.cnt ? fmtMs(b.sum / b.cnt) : "–", b.cnt ? fmtMs(b.min) : "–", b.cnt ? fmtMs(b.max) : "–", String(b.lost), (b.lost / b.n * 100).toFixed(1)];
      for (const c of cells) { const td = document.createElement("td"); td.textContent = c; tr.appendChild(td); }
      tb.appendChild(tr);
    }
  }

  // ---- render ----------------------------------------------------------------
  function render() {
    for (const b of seg.children) b.setAttribute("aria-pressed", String(b.dataset.key === rangeKey));
    const { rows, from, to } = slice();
    const s = stats(rows);
    const tiles = $("#tiles"); tiles.replaceChildren();
    tiles.append(
      tile("Average", fmtMs(s.avg), "ms"),
      tile("Median", fmtMs(s.p50), "ms"),
      tile("95th percentile", fmtMs(s.p95), "ms"),
      tile("Worst", fmtMs(s.max), "ms"),
      tile("Jitter (std dev)", s.sd == null ? "–" : s.sd < 10 ? s.sd.toFixed(1) : fmtMs(s.sd), "ms"),
      tile("Packet loss", s.n ? s.loss.toFixed(s.loss && s.loss < 10 ? 1 : 0) : "–", "%"),
      tile("Pings", s.n.toLocaleString(), ""),
    );
    const r = RANGES.find(x => x.key === rangeKey);
    view = rows.length ? layout(rows, from, to) : null;
    $("#chart-sub").textContent = rows.length
      ? `${fmtTime(from, true)} to ${fmtTime(to, true)} · each step is ${fmtStep(view.step)} · ${s.lost.toLocaleString()} of ${s.n.toLocaleString()} pings got no reply`
      : "No pings recorded in this range yet.";
    if (view) draw(view); else { const dpr = window.devicePixelRatio || 1; canvas.width = canvas.clientWidth * dpr; canvas.height = canvas.clientHeight * dpr; }
    hideHover();
    fillTable(rows);
  }

  window.addEventListener("resize", () => { if (view) { const { rows, from, to } = slice(); view = layout(rows, from, to); draw(view); } });
  if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
  render();
})();
</script>
</body>
</html>
