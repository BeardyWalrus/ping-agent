[package]
name = "ping-agent"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "System tray ping monitor for Windows: shows the current ping in milliseconds as the tray icon."
build = "build.rs"

[[bin]]
name = "PingAgent"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
ab_glyph = "0.2"

[target.'cfg(windows)'.dependencies]
native-windows-gui = { version = "1.0.13", default-features = false, features = [
    "tray-notification", "message-window", "menu", "timer", "notice",
    "textbox", "cursor", "high-dpi", "flexbox",
] }
winapi = { version = "0.3", features = [
    "winuser", "wingdi", "windef", "minwindef", "ntdef", "errhandlingapi",
    "shellapi", "synchapi", "handleapi", "winerror",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock", "Win32_System_Registry", "Win32_Security",
] }

[dev-dependencies]
png = "0.17"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
